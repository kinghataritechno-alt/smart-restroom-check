<meta name="apple-mobile-web-app-title" content="Smart Restroom">
<title>Smart Restroom Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: mobile-first single column (max 480px), role switch on top, sheets slide up from bottom */
:root{
  --bg:#eef3f3; --surface:#ffffff; --surface2:#f6f9f9; --ink:#12292b; --muted:#5b7173; --line:#d6e1e1;
  --accent:#0f7c80; --accent-ink:#ffffff; --accent-soft:#dcefef;
  --ok:#1f8a4c; --ok-soft:#dff2e6; --warn:#a86a12; --warn-soft:#fbefd9; --bad:#c2412d; --bad-soft:#fbe3de; --pend:#a7b4b5;
  --logo:#5a3a2e; --m:#2563a8; --m-soft:#e2ecf8; --f:#b33a6e; --f-soft:#f8e3ec; --d:#0f6e8a; --d-soft:#dcf0f5;
  --glass:rgba(255,255,255,.55); --glass-line:rgba(15,124,128,.22);
  --g-A:var(--ok); --g-B:var(--accent); --g-C:var(--warn); --g-D:var(--bad);
  --f-display:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai","Sarabun",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1617; --surface:#152123; --surface2:#1b2a2c; --ink:#e2eded; --muted:#8fa3a4; --line:#27393b;
  --accent:#4fc1c4; --accent-ink:#06282a; --accent-soft:#173739;
  --glass:rgba(255,255,255,.07); --glass-line:rgba(255,255,255,.22); --logo:#e8d3c8; --m:#8bb8ec; --m-soft:#1c2c40; --f:#f09cc0; --f-soft:#3a1e2b; --d:#6fd0e8; --d-soft:#15333b; --ok:#52c784; --ok-soft:#173226; --warn:#e3a94e; --warn-soft:#382a14; --bad:#f07c64; --bad-soft:#3b1d17; --pend:#4d5f61; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1617; --surface:#152123; --surface2:#1b2a2c; --ink:#e2eded; --muted:#8fa3a4; --line:#27393b;
  --accent:#4fc1c4; --accent-ink:#06282a; --accent-soft:#173739;
  --glass:rgba(255,255,255,.07); --glass-line:rgba(255,255,255,.22); --logo:#e8d3c8; --m:#8bb8ec; --m-soft:#1c2c40; --f:#f09cc0; --f-soft:#3a1e2b; --d:#6fd0e8; --d-soft:#15333b; --ok:#52c784; --ok-soft:#173226; --warn:#e3a94e; --warn-soft:#382a14; --bad:#f07c64; --bad-soft:#3b1d17; --pend:#4d5f61; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:23px}h2{font-size:19.5px}h3{font-size:17px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:6px 12px}
.top .brand{flex:1 1 100%;min-width:0}
.brand small{display:block;font-size:14px;color:var(--muted);letter-spacing:.04em}
.sample{font-size:12.5px;padding:2px 8px;border-radius:99px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg button{border:0;background:none;padding:8px 4px;border-radius:9px;font-weight:500;font-size:16px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.who{display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;width:100%}
.row .main{flex:1;min-width:0}
.row .title{font-weight:600}
.floor{font-family:var(--f-display);font-weight:700;font-size:20.5px;width:44px;height:44px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;text-align:center;flex:none}
.chip{font-size:14px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.c-pending{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.c-submitted{background:var(--warn-soft);color:var(--warn)}
.c-passed{background:var(--ok-soft);color:var(--ok)}
.c-failed{background:var(--bad-soft);color:var(--bad)}
.flag{color:var(--bad);font-size:14px;font-weight:600}
.empty{text-align:center;color:var(--muted);padding:24px 8px}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-family:var(--f-mono);font-size:25.5px;font-variant-numeric:tabular-nums}
.kpi span{font-size:14px;color:var(--muted)}
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}

.gridwrap{overflow-x:auto}
table.fg{border-collapse:separate;border-spacing:3px;width:100%;font-size:14px}
.fg th{font-weight:500;color:var(--muted);text-align:center}
.fg td.f{font-family:var(--f-mono);color:var(--muted);text-align:right;padding-right:6px;width:32px}
.fg td.cell{height:18px;border-radius:4px;position:relative}
.fg td.sp{width:8px}
.s-pending{background:transparent;box-shadow:inset 0 0 0 1px var(--pend)}
.s-submitted{background:var(--warn)}
.s-passed{background:var(--ok)}
.s-failed{background:var(--bad)}
.fg td.iss::after{content:"";position:absolute;right:2px;top:2px;width:5px;height:5px;border-radius:50%;background:var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}

.btn{border:0;border-radius:11px;padding:12px 14px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,20,21,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92%;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.x{border:0;background:var(--surface2);border-radius:99px;width:34px;height:34px;flex:none}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.item.isbad{border-color:var(--bad)}
.item-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.item-top .lbl{min-width:0}
.tog{display:flex;gap:6px;flex:none}
.tog button{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:6px 10px;font-size:15px;font-weight:600;color:var(--muted)}
.tog button.on-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.tog button.on-bad{background:var(--bad);border-color:var(--bad);color:#fff}
textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px;min-height:62px;resize:vertical}
.photo{display:flex;gap:10px;align-items:center}
.photo label{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--bad);color:var(--bad);border-radius:10px;padding:8px 12px;font-size:15px;font-weight:600;cursor:pointer}
.photo input{position:absolute;opacity:0;width:1px;height:1px}
.thumb{width:72px;height:72px;border-radius:10px;object-fit:cover;flex:none;background:var(--surface2);border:1px solid var(--line)}
.ph{width:72px;height:72px;border-radius:10px;flex:none;display:grid;place-items:center;text-align:center;font-size:12.5px;color:var(--muted);background:repeating-linear-gradient(45deg,var(--surface2) 0 6px,var(--line) 6px 7px);border:1px solid var(--line)}
.warnbox{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:16px}
.datebar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.datebar.past{border-color:var(--warn);background:var(--warn-soft)}
.datebar label{font-size:15px;color:var(--muted);white-space:nowrap}
.datebar input{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 8px;flex:1;min-width:0}
.datebar .btn{white-space:nowrap}
.pastnote{color:var(--warn);font-size:15px;font-weight:500;margin-top:-6px}
.fg td.cell.tap{cursor:pointer}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:10px 12px;font-size:16px}
.err{color:var(--bad);font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:16px;z-index:30;max-width:90%}
pre.report{white-space:pre-wrap;font-family:var(--f-body);font-size:15px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0;max-height:260px;overflow:auto}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 120px 28px;align-items:center;gap:8px;font-size:15px}
.hbar .t{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--bad)}
svg text{fill:var(--muted);font-family:var(--f-mono);font-size:11.5px}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:-14px -16px 0;padding:12px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.back{display:inline-flex;align-items:center;gap:6px;height:44px;min-width:44px;padding:0 16px 0 10px;border:0;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-weight:600;font-size:17px;flex:none}
.back svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.back:active{transform:scale(.97)}
.nav-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.fhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.fhead .fl{display:flex;align-items:center;gap:10px;flex:none}
.fstaff{text-align:right;font-size:14.5px;line-height:1.45;min-width:0;flex:1}
.fstaff>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fstaff.wide{text-align:left}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 12px}
.fgrid>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fstaff .muted{font-size:13px}
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.today div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.today b{display:block;font-family:var(--f-mono);font-size:23px}
.today span{font-size:14px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:128px;position:relative}
.tile.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center}
.tile .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.tile .ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-family:var(--f-display);font-size:18.5px;line-height:1.3}
.tile small{color:var(--muted);font-size:14.5px;line-height:1.4}
.tile .badge{position:absolute;top:12px;right:12px;background:var(--bad);color:#fff;font-size:14px;font-weight:600;border-radius:99px;padding:1px 8px}
.tile.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.primary .ic{background:rgba(255,255,255,.18);color:var(--accent-ink)}
.tile.primary small{color:var(--accent-ink);opacity:.85}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{font-weight:500;color:var(--muted);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tbl td:first-child{font-family:var(--f-body)}
.tbl tr.total td{font-weight:600;border-bottom:0}
.tbl tr.future td{color:var(--muted)}
.stock{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.stock:last-child{border-bottom:0}
.stock .bar{grid-column:1/-1;margin-top:2px}
.tag{font-size:12.5px;padding:1px 7px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);margin-left:6px;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:5px;font-size:16px}
.field select,.field input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.log{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.log:last-child{border-bottom:0}
.log .dir{font-family:var(--f-mono);font-weight:600;width:52px;flex:none;text-align:right}
.log .in{color:var(--ok)}.log .out{color:var(--bad)}
.log .main{flex:1;min-width:0}
.co-bar{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.co-logo{width:52px;height:56px;flex:none;display:block}
.co-logo img{width:100%;height:100%;object-fit:contain;display:block}
.today-line{font-size:15px;color:var(--muted);margin-top:2px}
.ricon{width:30px;height:30px;border-radius:8px;display:inline-grid;place-items:center;flex:none}
.ricon svg{width:20px;height:20px;fill:currentColor}
th .ricon,.legend .ricon{width:18px;height:18px;border-radius:5px}
th .ricon svg,.legend .ricon svg{width:13px;height:13px}
.r-M{background:var(--m-soft);color:var(--m)}.r-F{background:var(--f-soft);color:var(--f)}.r-D{background:var(--d-soft);color:var(--d)}
.co-name{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.co-name b{font-family:var(--f-display);font-size:19.5px;letter-spacing:.01em}
.co-name small{font-size:12px;color:var(--muted);letter-spacing:.06em}
.kpi-row{align-items:center}
.rank{width:28px;height:28px;border-radius:99px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1;padding:0;font-family:var(--f-mono);font-size:15px;font-weight:600;background:var(--surface2);color:var(--muted);flex:none}
.rank.top{background:var(--accent);color:var(--accent-ink)}
.kpi-row .bar{display:block;margin-top:6px}
.kpi-sc{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.kpi-sc b{font-size:23px;line-height:1}
.g-A{background:var(--ok-soft);color:var(--ok)}.g-B{background:var(--accent-soft);color:var(--accent)}.g-C{background:var(--warn-soft);color:var(--warn)}.g-D{background:var(--bad-soft);color:var(--bad)}
.gdist{display:flex;gap:3px;height:26px;border-radius:8px;overflow:hidden}
.gdist i{display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:600;min-width:34px}
.spark{display:block}
.tbl td,.tbl th{white-space:nowrap}
.ophotos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ophotos img,.ophotos .ph,.opadd{width:100%;aspect-ratio:1;height:auto;border-radius:10px;object-fit:cover;display:block}
.op{position:relative;display:block}
.opx{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:99px;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center}
.opadd{border:1.5px dashed var(--accent);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:16px;font-weight:600;cursor:pointer;position:relative}
.opadd input{position:absolute;opacity:0;width:1px;height:1px}
optgroup{font-weight:600}
.selfie-ok{background:var(--glass);border-color:var(--glass-line);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.selfie-ok .ph{background:repeating-linear-gradient(45deg,transparent 0 6px,var(--glass-line) 6px 7px);border-color:var(--glass-line)}
.ck{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:99px;background:#1f8a4c;color:#ffffff;font-size:13px;vertical-align:1px}
.co-name{flex:1;min-width:0}
.co-name small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.theme-btn{flex:none;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);font-size:14px;font-weight:600}
.theme-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}

/* ===== รายงาน PDF (พิมพ์ / บันทึกเป็น PDF) ===== */
#print{display:none}
@media print{
  @page{size:A4 landscape;margin:7mm 9mm 8mm}
  html,body{background:#fff!important}
  body>*:not(#print){display:none!important}
  #print{display:block;color:#15282a;font-family:"Sarabun","IBM Plex Sans Thai",sans-serif;font-size:8.4pt;line-height:1.3;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
#print .rp-page{page-break-after:always;break-after:page}
#print .rp-page:last-child{page-break-after:auto;break-after:auto}
#print .hd{display:flex;justify-content:space-between;align-items:center;border-bottom:2pt solid #0f7c80;padding:2mm 0 2.5mm;min-height:20mm}
#print .hd small{display:block;color:#0f7c80;font-weight:700;font-size:9pt}
#print .hd h1{font-size:14pt;margin:.5mm 0 0;font-family:inherit}
#print .co{display:flex;align-items:center;gap:2.5mm;text-align:right}
#print .co b{display:block;font-size:9pt}#print .co span{display:block;font-size:7pt;color:#556;letter-spacing:.04em}
#print .co img{height:14mm;width:auto;display:block}
#print .meta{display:flex;gap:6mm;margin:1.5mm 0 2mm;font-size:8.6pt;flex-wrap:wrap}
#print .meta .no{margin-left:auto;color:#556}
#print .sum{border:.8pt solid #1f7a45;background:#eef7f1;border-radius:1.5mm;padding:1.2mm 2.5mm;margin-bottom:2mm;font-size:8pt}
#print .sum.warn{border-color:#b8371f;background:#fbeeea}
#print .sum b.big{font-size:10pt;color:#1f7a45}#print .sum.warn b.big{color:#b8371f}
#print h2{font-size:10pt;margin:2.5mm 0 1.2mm;color:#0f5f62;font-family:inherit}
#print table{width:100%;border-collapse:collapse}
#print th,#print td{border:.5pt solid #9fb3b3;padding:.2mm 1.1mm;vertical-align:middle;line-height:1.18}
#print th{background:#e3efef;font-weight:700;font-size:7.6pt;text-align:center}
#print td.c{text-align:center;white-space:nowrap}#print td.n{text-align:right}
#print td.f{text-align:center;font-weight:700;background:#f3f8f8}
#print td.st{font-size:6.9pt;line-height:1.15}
#print tr.zone td{background:#0f7c80;color:#fff;font-weight:700;font-size:7.2pt}
#print .p{color:#1f7a45;font-weight:700}#print .x{color:#b8371f;font-weight:700}#print .nt{color:#99a}
#print .fx{color:#a35f00;font-weight:700}#print .fx small{font-size:6.2pt;font-weight:400}
#print .legend{font-size:7.2pt;color:#556;margin-top:1.2mm}
#print .photos{display:grid;grid-template-columns:repeat(6,1fr);gap:2.5mm}
#print .rph{border:.5pt solid #9fb3b3;border-radius:1.5mm;overflow:hidden;break-inside:avoid}
#print .rph img,#print .rph .no-img{width:100%;height:30mm;object-fit:cover;display:block;background:#f3f7f7}
#print .rph .no-img{display:flex;align-items:center;justify-content:center;color:#8aa}
#print .rph div.cap{padding:.8mm 1.4mm;font-size:6.8pt;line-height:1.25}
#print .notes{border:.5pt solid #9fb3b3;height:11mm;border-radius:1.2mm}
#print .sig{display:grid;grid-template-columns:repeat(5,1fr);gap:4mm;margin-top:4mm;text-align:center;font-size:7.8pt;break-inside:avoid}
#print .sig>div{padding-top:9mm}#print .sig .ln{border-top:.6pt dotted #333;padding-top:1mm}

      <button data-act="role" data-v="sup" aria-pressed="${S.role==='sup'}">หัวหน้าแม่บ้าน</button>

    ${viewHome()}`;
  } else {
    const body=(['check','daily','other'].includes(S.page)?dateBar():'')+(LIVE&&['weekly','monthly','kpi'].includes(S.page)?liveNotice:'')+{check:viewCheck,daily:mgrToday,weekly:viewWeekly,monthly:mgrMonth,supply:viewSupply,staff:viewStaff,kpi:viewKpi,other:viewOther,pin:viewPin}[S.page]();
    html=`<div class="nav"><button class="back" data-act="home" aria-label="กลับหน้าแรก"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>หน้าแรก</button><div class="nav-t"><div class="muted small">${S.page==='pin'?'ต้องใส่รหัสก่อนเข้าดู':roleName()+' · '+userName()}</div><h1>${PAGES[S.page]}</h1></div></div>${body}`;
  }
  // เก็บค่าที่กรอกค้างในแผ่นล่าง (sheet) ไม่ให้หายเมื่อหน้ารีเฟรช เช่น ตอนข้อความแจ้งเตือนหายไป
  const sk=JSON.stringify(S.sheet),keep={};
  if(sk===render.lastSheet)document.querySelectorAll('#layer input[id],#layer select[id],#layer textarea[id]').forEach(el=>{if(el.type!=='file')keep[el.id]=el.value});
  render.lastSheet=sk;
  document.body.classList.toggle('lg-bg',S.page==='login');
  document.getElementById('app').innerHTML=html;
  document.getElementById('layer').innerHTML=(S.sheet?sheet():'')+(S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:'');
  for(const id in keep){const el=document.getElementById(id);if(el)el.value=keep[id]}
  if(S.page==='pin'){const p=document.getElementById('pin');if(p)p.focus()}
}

// ================== รายงาน ==================
function todayStats(){
  const vals=Object.values(REC);const total=vals.length;
  const done=vals.filter(x=>x.status!=='pending').length,passed=vals.filter(x=>x.status==='passed').length,failed=vals.filter(x=>x.status==='failed').length;
  const issues=[],fails=[];
  for(const [k,x] of Object.entries(REC)){const [,rd,id]=k.split('|');
    (x.issues||[]).forEach(i=>issues.push({rd,room:roomById[id],...i}));
    if(x.status==='failed')fails.push({rd,room:roomById[id],issues:x.issues})}
  const byRound=rd=>{const v=ROOMS.map(r=>REC[key(rd,r.id)]);return {done:v.filter(x=>x.status!=='pending').length,passed:v.filter(x=>x.status==='passed').length,failed:v.filter(x=>x.status==='failed').length,total:v.length}};
  return {total,done,passed,failed,issues,fails,am:byRound('am'),pm:byRound('pm')};
}
function mgrToday(){
  const s=todayStats();
  const cell=(rd,r)=>{const x=REC[key(rd,r.id)];const t=x.status!=='pending';return `<td class="cell s-${x.status}${t?' tap':''}"${t?` data-act="vopen" data-v="${rd}|${r.id}"`:''} title="ชั้น ${r.floor} ${r.label} ${ROUNDS[rd]}: ${STLBL[x.status]}"></td>`};
  const rows=[...FLOORS].reverse().map(f=>{const rs=ROOMS.filter(r=>r.floor===f);return `<tr><td class="f">${f}</td>${rs.map(r=>cell('am',r)).join('')}<td class="sp"></td>${rs.map(r=>cell('pm',r)).join('')}</tr>`});

async function loadLive(){

  TODAY=S.viewDate||REAL_TODAY;
  for(const k in REC)delete REC[k];for(const r of ROOMS)for(const rd of ['am','pm'])REC[key(rd,r.id)]={status:'pending'};
  for(const k in CHECKIN)delete CHECKIN[k];OREC.length=0;TX.length=0;
  const [ck,ins,ow,sup,tx]=await Promise.all([
    sb.from('checkins').select('*').eq('work_date',TODAY),
    sb.from('inspections').select('*,inspection_issues(*)').eq('work_date',TODAY).order('attempt'),
    sb.from('other_work').select('*,other_work_photos(*)').eq('work_date',TODAY).order('created_at',{ascending:false}),
    sb.from('supplies').select('*'),
    sb.from('supply_tx').select('*').order('created_at',{ascending:false}).limit(50)]);
  for(const r of [ck,ins,ow,sup,tx])if(r.error)throw r.error;
  const urls=await signedUrls([...ck.data.map(x=>x.photo_path),...ins.data.flatMap(x=>x.inspection_issues.map(i=>i.photo_path)),...ow.data.flatMap(x=>x.other_work_photos.map(p=>p.photo_path))]);
  ck.data.forEach(x=>{CHECKIN[ckey(x.round,x.floor)]={photo:urls[x.photo_path]||null,time:hmTH(x.created_at),head:headName(x.head_code)}});
  ins.data.forEach(x=>{const r=roomById[x.room_id];if(!r)return;const pk=key(x.round,x.room_id),prev=REC[pk];const o=REC[pk]={status:x.status,items:x.items,attempt:x.attempt,
    issues:x.inspection_issues.map(i=>({item:i.item_key,note:i.note,photo:urls[i.photo_path]||null})),staff:staffNames(r.floor),time:hmTH(x.created_at),inspector:headName(x.head_code)};o.hist=[...(prev.hist||[]),{status:o.status,issues:o.issues,time:o.time,inspector:o.inspector}]});
  ow.data.forEach(x=>OREC.push({id:x.id,time:hmTH(x.created_at),task:x.task_code,loc:x.location,note:x.note||'',head:headName(x.head_code),

  sup.data.forEach(x=>{const s=supById[x.id];if(s){s.qty=x.qty;s.min=x.min_qty}});

// ประทับวันเวลา ชั้น ห้อง ผู้ตรวจ ลงบนภาพ + กันภาพเก่าจากอัลบั้ม
const TH_MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const MAX_AGE_MIN=5;
function stampPhoto(file,ctx){return new Promise((res,rej)=>{
  // iPhone/Android: ชนิดไฟล์อาจว่างหรือเป็น HEIC — ลองเปิดภาพก่อน ไม่ตัดสินจากชนิดไฟล์
  if(file.type&&!/^image\//.test(file.type))return rej(new Error('ไฟล์นี้ไม่ใช่ภาพถ่าย'));
  const lm=file.lastModified||0;const age=lm>0?(Date.now()-lm)/60000:0;
  const maxA=ctx.maxAge||MAX_AGE_MIN;if(age>maxA)return rej(new Error(maxA>MAX_AGE_MIN?`ภาพนี้ไม่ได้ถ่ายวันนี้ ใช้ภาพที่ถ่ายวันนี้เท่านั้น`:`ภาพนี้ถ่ายไว้ ${Math.round(age)} นาทีแล้ว ต้องถ่ายใหม่ขณะตรวจ`));
  const draw=(src,w0,h0,done)=>{const sc=Math.min(1,1280/Math.max(w0,h0));const w=Math.max(1,Math.round(w0*sc)),h=Math.max(1,Math.round(h0*sc));
    const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.drawImage(src,0,0,w,h);done&&done();
    const t=new Date(lm>0?lm:Date.now());const hd=myHead();
    const lines=[`${t.getDate()} ${TH_MON[t.getMonth()]} ${t.getFullYear()+543}  ${hhmm(t.getHours(),t.getMinutes())}:${String(t.getSeconds()).padStart(2,'0')} น.`,
      `${ctx.loc||('ชั้น '+ctx.floor)} · ${ctx.place}${ctx.rd?' · '+ROUNDS[ctx.rd]:''}`,`${ctx.what}`,`ผู้ตรวจ: หัวหน้า${hd.name} (${hd.code}) · SmartTerminal`];
    const fs=Math.max(14,Math.round(w/30)),lh=Math.round(fs*1.35),pad=Math.round(fs*.6),bh=lines.length*lh+pad*2;
    g.fillStyle='rgba(8,30,32,.72)';g.fillRect(0,h-bh,w,bh);g.fillStyle='#ffffff';g.textBaseline='top';
    lines.forEach((l,i)=>{g.font=`${i===0?'600 ':''}${fs}px "IBM Plex Sans Thai",sans-serif`;g.fillText(l,pad,h-bh+pad+i*lh,w-pad*2)});
    let out;try{out=c.toDataURL('image/jpeg',.8)}catch(_){out=null}
    if(!out||out.length<100)return rej(new Error('บันทึกภาพไม่สำเร็จ ลองถ่ายใหม่อีกครั้ง'));res(out)};
  const viaImg=()=>{const fr=new FileReader();
    fr.onerror=()=>rej(new Error('อ่านภาพไม่ได้ ลองถ่ายใหม่'));
    fr.onload=()=>{const img=new Image();img.onerror=()=>rej(new Error('เปิดภาพไม่ได้ (รูปแบบไฟล์ไม่รองรับ) ลองถ่ายใหม่'));
      img.onload=()=>draw(img,img.naturalWidth||img.width,img.naturalHeight||img.height);img.src=fr.result};
    fr.readAsDataURL(file)};
  if(window.createImageBitmap){createImageBitmap(file).then(bm=>draw(bm,bm.width,bm.height,()=>bm.close&&bm.close())).catch(viaImg)}
  else viaImg();
})}
document.addEventListener('input',e=>{const k=e.target.dataset?.note;if(k&&S.draft)S.draft.notes[k]=e.target.value;
  if(e.target.id==='o-note'&&S.odraft)S.odraft.note=e.target.value;
  if(e.target.id==='staff-q'){const q=e.target.value.trim().toLowerCase();let any=false;
    document.querySelectorAll('[data-grp]').forEach(g=>{let n=0;g.querySelectorAll('[data-q]').forEach(r=>{const m=!q||r.dataset.q.includes(q);r.hidden=!m;if(m)n++});g.hidden=!n;if(n)any=true});
    document.getElementById('staff-none').hidden=any}});
render();initLive();
</script>
